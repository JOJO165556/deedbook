[project]
name = "deedbook-sdk"
version = "1.0.0"
description = "Kit d'intégration deedbook - envoi d'événements d'audit sans jamais faire tomber l'hôte"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deedbook_sdk"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/deedbook_sdk",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
