# Déploiement durci de production deedbook
# Usage : docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

services:
  db:
    build:
      context: ./db
    container_name: deedbook-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEEDBOOK_DB_USER:-deedbook_admin}
      POSTGRES_PASSWORD: ${DEEDBOOK_DB_PASSWORD:?Définir dans .env}
      POSTGRES_DB: ${DEEDBOOK_DB_NAME:-deedbook}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - deedbook_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: ../server
    container_name: deedbook-api-prod
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${DEEDBOOK_PORT:-8000}:8000"
    networks:
      - deedbook_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata_prod:

networks:
  deedbook_internal:
    internal: false
